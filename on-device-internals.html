<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Copyright (c) 2001-2026 JServlet.com Franck ANDRIANO." />
    <meta name="application-name" content="On-Device Internals" lang="en" />
    <title>On-Device Internals</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Highlight.js for Syntax Highlighting (Canvas Feature) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-color: #202124;
            --text-color: #e8eaed;
            --panel-bg: #292a2d;
            --border-color: #3c4043;
            --btn-bg: #303134;
            --btn-hover: #424548;
            --btn-active: #8ab4f8;
            --user-msg-bg: #e8eaed;
            --user-msg-text: #202124;
            --ai-msg-bg: #8ab4f8;
            --ai-msg-text: #202124;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* --- TABS SYSTEM --- */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--text-color);
            text-align: center;
            border-radius: 0;
            box-shadow: none;
            font-size: 14px;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            border-bottom: 2px solid var(--btn-active);
            color: var(--btn-active);
        }

        .tab-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* --- UI COMPONENTS --- */
        .accordion {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        summary {
            padding: 15px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .accordion-icon {
            display: inline-block;
            transition: transform 0.3s ease;
            font-size: 12px;
            color: var(--btn-active);
        }

        details[open] .accordion-icon {
            transform: rotate(180deg);
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .control-group label {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .checkbox-label {
            cursor: pointer;
            font-size: 13px !important;
            display: flex;
            align-items: center;
            gap: 5px;
            height: 20px;
        }

        .features-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 25px;
        }

        .tooltip-icon {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--border-color);
            color: var(--text-color);
            text-align: center;
            font-size: 10px;
            line-height: 14px;
            cursor: help;
            position: relative;
        }

        .tooltip-text {
            visibility: hidden;
            width: 200px;
            background-color: #000;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 10px;
            position: absolute;
            z-index: 10;
            bottom: 125%;
            left: 50%;
            margin-left: -100px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 11px;
            font-weight: normal;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .tooltip-icon:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }

        select, input[type="number"] {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px;
            border-radius: 4px;
            outline: none;
            width: 120px;
        }

        .input-section { margin-bottom: 20px; }
        .input-section label { display: block; font-size: 12px; margin-bottom: 8px; }

        textarea {
            width: 100%;
            height: 100px;
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
            outline: none;
        }

        #contextInput {
            height: 80px;
            margin-top: 10px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--btn-bg);
            color: var(--btn-active);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background-color 0.2s;
        }

        .btn:hover { background-color: var(--btn-hover); }
        .btn-primary { background-color: var(--border-color); color: var(--text-color); }
        .btn-danger { background-color: transparent; color: #f28b82; border-color: #f28b82; }
        .btn-danger:hover { background-color: rgba(242, 139, 130, 0.1); }

        /* --- CHAT BUBBLES --- */
        #conversationContainer {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message-pair {
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-left: 2px solid var(--border-color);
            padding-left: 15px;
            margin-bottom: 10px;
        }

        .bubble {
            padding: 15px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .bubble-user {
            background-color: var(--user-msg-bg);
            color: var(--user-msg-text);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            max-height: 135px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .bubble-ai {
            background-color: var(--ai-msg-bg);
            color: var(--ai-msg-text);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            width: 100%;
            position: relative; /* Needed for TTS and Metrics positioning */
        }

        /* --- TEXT-TO-SPEECH BUTTON --- */
        .tts-btn {
            position: absolute;
            bottom: 10px;
            right: 15px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 18px;
            opacity: 0.6;
            transition: all 0.2s ease;
            padding: 5px;
            border-radius: 50%;
        }
        .tts-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }
        .tts-btn.playing {
            opacity: 1;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
        }

        /* --- Code Canvas Styling --- */
        .bubble-ai pre {
            background-color: #1e1e1e;
            color: #d4d4d4;
            border-radius: 8px;
            overflow: hidden;
            margin: 10px 0;
            padding: 0;
        }
        .canvas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2d2d2d;
            padding: 5px 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 12px;
            color: #9aa0a6;
            border-bottom: 1px solid #444;
        }
        .bubble-ai pre code {
            display: block;
            padding: 15px;
            overflow-x: auto;
            font-family: Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace;
            font-size: 13px;
        }
        .copy-btn {
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
            border-radius: 4px;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .copy-btn:hover { background: #444; color: #fff; }

        #fileInfo { font-size: 12px; color: var(--btn-active); margin-left: 10px; align-self: center; }

        /* --- LOGS STYLES --- */
        .console-box {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            min-height: 250px;
            max-height: 500px;
            overflow-y: auto;
            font-family: Consolas, Monaco, 'Andale Mono', monospace;
            font-size: 13px;
            border: 1px solid var(--border-color);
        }
        .log-entry { margin-bottom: 8px; border-bottom: 1px dashed #333; padding-bottom: 4px; }
        .log-time { color: #5eead4; margin-right: 10px; }
        .log-msg { color: #d1d5db; }
        .log-error { color: #fca5a5; }

        .dummy-content {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            color: #9aa0a6;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>On-Device Internals</h1>

    <!-- HEADER DES ONGLETS -->
    <div class="tabs">
        <button class="tab-btn active" data-target="tab-tools">Tools</button>
        <button class="tab-btn" data-target="tab-logs">Event Logs</button>
        <button class="tab-btn" data-target="tab-status">Model Status</button>
    </div>

    <!-- CONTENU ONGLET 1 : TOOLS -->
    <div id="tab-tools" class="tab-content active">

        <details class="accordion">
            <summary>
                <span>Context options (current size: <span id="contextWordCount">0</span> words)</span>
                <span class="accordion-icon">▼</span>
            </summary>
            <div style="padding: 15px; font-size: 13px;">
                <label style="color: #9aa0a6; margin-bottom: 5px; display: block;">System Prompt / Context definition:</label>
                <textarea id="contextInput" placeholder="Define critical instructions here... (e.g., 'You are a pirate')"></textarea>
            </div>
        </details>

        <div class="controls">
            <div class="control-group">
                <label>Language</label>
                <select id="languageSelect">
                    <!-- Langues classiques -->
                    <option value="en-US">English (en-US)</option>
                    <option value="fr-FR">Français (fr-FR)</option>
                    <option value="es-ES">Español (es-ES)</option>
                    <option value="ja-JP">日本語 (ja-JP)</option>
                    <option value="de-DE">Deutsch (de-DE)</option>
                    <option value="it-IT">Italiano (it-IT)</option>
                    <!-- Nouvelles langues ajoutées -->
                    <option value="ko-KR">한국어 (ko-KR)</option>
                    <option value="pt-BR">Português (pt-BR)</option>
                    <option value="ru-RU">Русский (ru-RU)</option>
                    <option value="ar-SA">العربية (ar-SA)</option>
                    <option value="hi-IN">हिन्दी (hi-IN)</option>
                    <option value="zh-CN">简体中文 (zh-CN)</option>
                    <option value="zh-TW">繁體中文 (zh-TW)</option>
                </select>
            </div>
            <div class="control-group">
                <label>Top K
                    <span class="tooltip-icon">?
                            <span class="tooltip-text">Defines the number of probable tokens the model chooses from. Lower value makes output more deterministic.</span>
                        </span>
                </label>
                <input type="number" id="topK" value="3" min="1" max="40">
            </div>
            <div class="control-group">
                <label>Temperature
                    <span class="tooltip-icon">?
                            <span class="tooltip-text">Controls creativity. 0 = strict/deterministic, 1 = highly creative. Default: 0.8.</span>
                        </span>
                </label>
                <input type="number" id="temperature" value="0.8" step="0.1" min="0" max="2">
            </div>

            <div class="control-group">
                <label>Features</label>
                <div class="features-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="enableCanvas" checked>
                        Markdown & Code Canvas
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="autoReadVoice">
                        Auto-Read Voice
                    </label>
                </div>
            </div>
        </div>

        <div class="input-section">
            <label>Input</label>
            <textarea id="promptInput" placeholder="Ask a question, provide instructions, or describe the attached media..."></textarea>
        </div>

        <div class="buttons">
            <input type="file" id="imageInput" accept="image/*, audio/*" style="display: none;">
            <button class="btn" onclick="document.getElementById('imageInput').accept='image/*'; document.getElementById('imageInput').click()">+ Add image</button>
            <button class="btn" onclick="document.getElementById('imageInput').accept='audio/*'; document.getElementById('imageInput').click()">+ Add audio</button>
            <span id="fileInfo"></span>
        </div>

        <div class="buttons">
            <button class="btn btn-primary" id="executeBtn">Execute</button>
            <button class="btn btn-danger" id="cancelBtn" style="display: none;">Stop</button>
            <button class="btn" onclick="clearUI();">Clear Input</button>
        </div>

        <div id="conversationContainer">
            <!-- Les nouvelles conversations viendront s'empiler ici -->
        </div>
    </div>

    <!-- CONTENU ONGLET 2 : EVENT LOGS -->
    <div id="tab-logs" class="tab-content">
        <div class="console-box" id="eventLogs">
            <!-- Les logs dynamiques s'afficheront ici -->
        </div>
    </div>

    <!-- CONTENU ONGLET 3 : MODEL STATUS -->
    <div id="tab-status" class="tab-content">
        <div class="dummy-content" id="modelStatusBox">
            <p><strong>Checking Model Status...</strong></p>
        </div>
    </div>

</div>

<script>
    // --- GESTION COMPLÈTE DES ONGLETS (TABS) ---
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            tabBtns.forEach(t => t.classList.remove('active'));
            tabContents.forEach(c => c.classList.remove('active'));

            btn.classList.add('active');
            const targetId = btn.getAttribute('data-target');
            document.getElementById(targetId).classList.add('active');
        });
    });

    const executeBtn = document.getElementById('executeBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const promptInput = document.getElementById('promptInput');
    const contextInput = document.getElementById('contextInput');
    const contextWordCount = document.getElementById('contextWordCount');
    const topKInput = document.getElementById('topK');
    const temperatureInput = document.getElementById('temperature');
    const languageSelect = document.getElementById('languageSelect');
    const enableCanvas = document.getElementById('enableCanvas');
    const autoReadVoice = document.getElementById('autoReadVoice');
    const conversationContainer = document.getElementById('conversationContainer');
    const imageInput = document.getElementById('imageInput');
    const fileInfo = document.getElementById('fileInfo');

    let currentFile = null;
    let attachmentType = null;
    let aiSession = null;
    let abortController = null;

    // --- GESTION DES RACCOURCIS CLAVIER ---
    promptInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            // Si Shift, Ctrl, ou Meta (Mac) sont pressés
            if (e.shiftKey || e.ctrlKey || e.metaKey) {
                // Pour Ctrl+Enter et Meta+Enter, on force manuellement le saut de ligne
                // (Car le comportement natif ne fait parfois rien)
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    const start = this.selectionStart;
                    const end = this.selectionEnd;
                    this.value = this.value.substring(0, start) + "\n" + this.value.substring(end);
                    // On replace le curseur juste après le saut de ligne
                    this.selectionStart = this.selectionEnd = start + 1;
                }
                // On ne fait rien d'autre (surtout pas de soumission)
                return;
            }

            // Si ENTER est pressé seul (sans Shift, sans Ctrl)
            e.preventDefault(); // Empêche le saut de ligne natif
            if (!executeBtn.disabled) {
                executeBtn.click();
            }
        }
    });

    // --- GESTION DES LOGS ---
    const logsContainer = document.getElementById('eventLogs');
    function addLog(msg, isError = false) {
        const now = new Date();
        const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span class="log-time">[${timeStr}]</span> <span class="${isError ? 'log-error' : 'log-msg'}">${msg}</span>`;
        logsContainer.appendChild(entry);
        logsContainer.scrollTop = logsContainer.scrollHeight;
    }

    // Récupère l'API de manière sécurisée
    function getAiApi() {
        try {
            if (typeof LanguageModel !== 'undefined') return LanguageModel;
            if (window.ai && window.ai.languageModel) return window.ai.languageModel;
        } catch (e) {
            console.warn("API not found:", e);
        }
        return null;
    }

    // Évaluation des performances du device
    function getDevicePerformanceClass() {
        // navigator.deviceMemory retourne la RAM en Go (souvent plafonnée à 8 pour des raisons de vie privée)
        const ram = navigator.deviceMemory || 4;
        // navigator.hardwareConcurrency retourne le nombre de cœurs logiques CPU
        const cores = navigator.hardwareConcurrency || 4;

        let score = 0;
        if (ram >= 8) score += 2;
        else if (ram >= 4) score += 1;

        if (cores >= 12) score += 2;
        else if (cores >= 8) score += 1;

        if (score >= 4) return "High 🟢 (16GB+ RAM, 12+ Cores)";
        if (score >= 2) return "Medium 🟡 (8GB+ RAM, 8+ Cores)";
        return "Low 🔴 (<8GB RAM, <8 Cores)";
    }

    // Initialisation et Status
    async function initModelStatus() {
        const statusBox = document.getElementById('modelStatusBox');
        addLog("Initializing Model Status check...");
        const aiApi = getAiApi();

        if (!aiApi) {
            const errorMsg = "LanguageModel API not found. Please check Chrome flags.";
            addLog(errorMsg, true);
            statusBox.innerHTML = `<p style="color: #fca5a5;"><strong>Error:</strong> ${errorMsg}</p>`;
            return;
        }

        try {
            const status = await aiApi.availability({ outputLanguage: "en-US" });
            addLog(`Model availability status: ${status}`);

            const perfClass = getDevicePerformanceClass();
            addLog(`Device performance estimated: ${perfClass.split(' ')[0]}`);

            statusBox.innerHTML = `
                    <p><strong>Model Status:</strong> <span style="color: #5eead4;">${status}</span></p>
                    <p><strong>API:</strong> window.ai.languageModel</p>
                    <p><strong>Hardware:</strong> On-Device WebGPU / WASM</p>
                    <p><strong>Performance Class:</strong> ${perfClass}</p>
                `;
        } catch(e) {
            addLog(`Error checking availability: ${e.message}`, true);
            statusBox.innerHTML = `<p style="color: #fca5a5;"><strong>Error:</strong> ${e.message}</p>`;
        }
    }
    initModelStatus();

    // Gestion du contexte et comptage de mots
    contextInput.addEventListener('input', () => {
        const text = contextInput.value.trim();
        const words = text ? text.split(/\s+/).length : 0;
        contextWordCount.textContent = words;
    });

    // Gestion du fichier joint (Image ou Audio)
    imageInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            currentFile = e.target.files[0];
            attachmentType = currentFile.type.startsWith('audio') ? 'audio' : 'image';
            fileInfo.textContent = `Attached: ${currentFile.name}`;
            addLog(`File attached: ${currentFile.name} (${Math.round(currentFile.size/1024)} KB) - Type: ${attachmentType}`);
        }
    });

    function clearUI() {
        promptInput.value = '';
        if (currentFile) addLog(`File removed: ${currentFile.name}`);
        currentFile = null;
        attachmentType = null;
        imageInput.value = '';
        fileInfo.textContent = '';

        if (window.speechSynthesis && window.speechSynthesis.speaking) {
            window.speechSynthesis.cancel();
        }
    }

    // --- GESTION DU BOUTON CANCEL ---
    cancelBtn.addEventListener('click', () => {
        if (abortController) {
            addLog("Sending Abort signal to stop generation...", true);
            abortController.abort();
        }
        if (aiSession) {
            try {
                aiSession.destroy();
                addLog("Session destroyed forcefully to stop generation.");
            } catch(e) {}
        }

        if (window.speechSynthesis && window.speechSynthesis.speaking) {
            window.speechSynthesis.cancel();
        }
    });

    executeBtn.addEventListener('click', async () => {
        const rawText = promptInput.value.trim();
        const systemContext = contextInput.value.trim();

        if (!rawText && !currentFile) return;

        const aiApi = getAiApi();
        if (!aiApi) {
            alert("The local AI API is not detected on this browser.");
            return;
        }

        executeBtn.disabled = true;
        executeBtn.textContent = 'Executing...';
        cancelBtn.style.display = 'flex';

        abortController = new AbortController();

        try {
            const pairContainer = document.createElement('div');
            pairContainer.className = 'message-pair';

            const userBubble = document.createElement('div');
            userBubble.className = 'bubble bubble-user';
            userBubble.textContent = rawText || "[Media Only]";
            if (currentFile) {
                userBubble.textContent += ` (Attached: ${currentFile.name})`;
            }

            if (systemContext) {
                userBubble.innerHTML += `<br><span style="font-size: 11px; color: var(--btn-active); margin-top: 5px; display: block;">✓ Context applied (${contextWordCount.textContent} words)</span>`;
            }

            const aiBubble = document.createElement('div');
            aiBubble.className = 'bubble bubble-ai';
            aiBubble.innerHTML = '<em>Thinking...</em>';

            pairContainer.appendChild(userBubble);
            pairContainer.appendChild(aiBubble);
            conversationContainer.prepend(pairContainer);

            addLog("Execution started. Building session...");

            if (aiSession) {
                aiSession.destroy();
                addLog("Previous session destroyed to free VRAM.");
            }

            let options = {
                temperature: parseFloat(temperatureInput.value),
                topK: parseInt(topKInput.value),
                signal: abortController.signal
            };

            if (systemContext) {
                options.systemPrompt = systemContext;
                addLog("Context (System Prompt) injected into session options.");
            }

            if (currentFile) {
                options.expectedInputs = [{ type: 'text' }, { type: attachmentType }];
            }

            addLog(`Creating session with Temp: ${options.temperature}, TopK: ${options.topK}`);
            aiSession = await aiApi.create(options);

            // Extraction du nom de la langue depuis le texte de l'option (ex: "한국어" pour le Coréen)
            const languageName = languageSelect.options[languageSelect.selectedIndex].text.split(' ')[0];

            let textWithSystemInstruction = rawText;
            if (systemContext && typeof options.systemPrompt === 'undefined') {
                textWithSystemInstruction = `[CRITICAL INSTRUCTION: ${systemContext}]\n\nUser request: ${rawText}`;
            }
            textWithSystemInstruction += `\n\n[Instruction for model: You must reply entirely in ${languageName}]`;

            let promptPayload = currentFile
                ? [{ role: 'user', content: [{ type: 'text', value: textWithSystemInstruction }, { type: attachmentType, value: currentFile }] }]
                : textWithSystemInstruction;

            // --- DEBUT DU CHRONOMETRE ET COMPTEURS ---
            const startTime = performance.now();
            let chunkCount = 0;
            // Heuristique pour estimer les tokens d'entrée (texte)
            const estimatedInputTokens = Math.ceil(textWithSystemInstruction.length / 4);

            const stream = await aiSession.promptStreaming(promptPayload);
            let fullResponse = '';

            aiBubble.innerHTML = '';

            // Augmente l'espace en bas pour les futures métriques et le bouton audio
            aiBubble.style.paddingBottom = "45px";
            const ttsBtn = document.createElement('button');
            ttsBtn.className = 'tts-btn';
            ttsBtn.title = 'Read aloud';
            ttsBtn.innerHTML = '🔈';
            let ttsQueued = autoReadVoice.checked;

            if (ttsQueued) {
                ttsBtn.classList.add('playing');
                ttsBtn.innerHTML = '🔊';
            }

            ttsBtn.addEventListener('click', () => {
                if (window.speechSynthesis.speaking && ttsBtn.innerHTML === '🔊') {
                    window.speechSynthesis.cancel();
                    ttsBtn.classList.remove('playing');
                    ttsBtn.innerHTML = '🔈';
                    ttsQueued = false;
                } else if (ttsBtn.innerHTML === '🔈') {
                    ttsQueued = true;
                    ttsBtn.classList.add('playing');
                    ttsBtn.innerHTML = '🔊';

                    if (executeBtn.disabled === false && fullResponse.length > 0) {
                        playTTS(fullResponse, ttsBtn);
                    }
                } else {
                    ttsQueued = false;
                    ttsBtn.classList.remove('playing');
                    ttsBtn.innerHTML = '🔈';
                }
            });

            aiBubble.appendChild(ttsBtn);

            for await (const chunk of stream) {
                if (abortController.signal.aborted) {
                    throw new DOMException("Generation aborted by user", "AbortError");
                }

                chunkCount++; // Incrémentation du nombre de morceaux reçus
                fullResponse += chunk;

                ttsBtn.remove(); // On l'enlève temporairement pendant le parse Markdown

                if (enableCanvas.checked) {
                    aiBubble.innerHTML = marked.parse(fullResponse);

                    aiBubble.querySelectorAll('pre').forEach((pre) => {
                        const codeBlock = pre.querySelector('code');
                        if (codeBlock) {
                            hljs.highlightElement(codeBlock);

                            const langClass = Array.from(codeBlock.classList).find(c => c.startsWith('language-'));
                            const langName = langClass ? langClass.replace('language-', '') : 'text';

                            const header = document.createElement('div');
                            header.className = 'canvas-header';
                            header.innerHTML = `
                                    <span style="text-transform: uppercase; letter-spacing: 0.5px;">${langName}</span>
                                    <button class="copy-btn" onclick="navigator.clipboard.writeText(this.parentElement.nextElementSibling.innerText); this.textContent='Copied!'; setTimeout(() => this.textContent='Copy', 2000);">Copy</button>
                                `;
                            pre.insertBefore(header, codeBlock);
                        }
                    });
                } else {
                    aiBubble.textContent = fullResponse;
                }

                aiBubble.appendChild(ttsBtn); // On le remet à sa place
            }

            // --- FIN DU CHRONOMETRE ET CALCULS ---
            const endTime = performance.now();
            const durationSec = (endTime - startTime) / 1000;
            const estimatedOutputTokens = Math.ceil(fullResponse.length / 4);
            const tps = (estimatedOutputTokens / durationSec).toFixed(1);

            // Ajout des métriques à l'interface
            const metricsDiv = document.createElement('div');
            // Ajout de white-space: nowrap pour garantir l'affichage sur une seule ligne
            metricsDiv.style.cssText = "position: absolute; bottom: 15px; right: 55px; font-size: 11px; font-family: Consolas, monospace; opacity: 0.7; white-space: nowrap;";
            metricsDiv.innerHTML = `⏱️ <em style="color: #0059ff;">${durationSec.toFixed(2)}s &nbsp;|&nbsp; 📥 In: ~${estimatedInputTokens} &nbsp;|&nbsp; 📤 Out: ~${estimatedOutputTokens} &nbsp;|&nbsp; 🧩 Chunks: ${chunkCount} &nbsp;|&nbsp; ⚡ ~${tps} TPS</em>`;
            aiBubble.appendChild(metricsDiv);

            addLog(`Execution completed in ${durationSec.toFixed(2)}s (~${tps} TPS). Input: ~${estimatedInputTokens}, Output: ~${estimatedOutputTokens}, Chunks: ${chunkCount}`);
            clearUI();

            if (ttsQueued) {
                playTTS(fullResponse, ttsBtn);
            }

        } catch (error) {
            if (error.name === 'AbortError') {
                addLog("Execution manually aborted.", true);
                if (conversationContainer.firstChild) {
                    const aiBubble = conversationContainer.firstChild.querySelector('.bubble-ai');
                    if (aiBubble) aiBubble.innerHTML += `<br><br><em style="color: #ff0000;">[Generation stopped by user]</em>`;
                }
            } else {
                console.error("Execution error:", error);
                addLog(`Execution failed: ${error.message}`, true);
                if (conversationContainer.firstChild) {
                    const aiBubble = conversationContainer.firstChild.querySelector('.bubble-ai');
                    if (aiBubble) aiBubble.innerHTML = `<strong>API Error:</strong> ${error.message}`;
                }
            }
        } finally {
            executeBtn.disabled = false;
            executeBtn.textContent = 'Execute';
            cancelBtn.style.display = 'none';
        }
    });

    function playTTS(text, btnElement) {
        if (window.speechSynthesis.speaking) {
            window.speechSynthesis.cancel();
        }

        const cleanTextForSpeech = text.replace(/[*_`#]/g, '');
        const utterance = new SpeechSynthesisUtterance(cleanTextForSpeech);

        // Uses BCP-47 tag for correct pronunciation rules
        utterance.lang = languageSelect.value;

        utterance.onstart = () => {
            btnElement.classList.add('playing');
            btnElement.innerHTML = '🔊';
        };

        utterance.onend = () => {
            btnElement.classList.remove('playing');
            btnElement.innerHTML = '🔈';
        };

        utterance.onerror = () => {
            btnElement.classList.remove('playing');
            btnElement.innerHTML = '🔈';
        };

        window.speechSynthesis.speak(utterance);
    }
</script>
</body>
</html>
